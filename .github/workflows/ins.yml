name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Güncelleme zip'i varsa otomatik uygula
        run: |
          if [ -f "PublicStatsApp_Guncel.zip" ]; then
            echo "PublicStatsApp_Guncel.zip bulundu, açılıyor..."
            unzip -o PublicStatsApp_Guncel.zip -x ".github/workflows/*"
            rm PublicStatsApp_Guncel.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Otomatik: zip icerigi projeye uygulandi [skip ci]"
              git push
            fi
          else
            echo "Güncelleme zip'i yok, mevcut haliyle devam ediliyor."
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK lisanslarını kabul et
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK ve AAB derle (debug)
        run: gradle assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Dosyaları adlandır
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p cikti
          cp app/build/outputs/apk/debug/app-debug.apk "cikti/PublicStats-$V.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "cikti/PublicStats-$V.aab"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: PublicStats-APK
          path: cikti/*.apk

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: PublicStats-AAB
          path: cikti/*.aab
